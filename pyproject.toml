[project]
name = "pipetree-meta"
version = "0.1.0"
description = "Metadata-driven pipeline orchestration: YAML in, a runnable dependency tree out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["data-engineering", "pipelines", "orchestration", "spark", "delta-lake", "databricks", "fabric", "metadata-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
authors = [
    { name = "David Fengler", email = "info@davidfengler.de" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/phant0mw0lf/pipetree"
Repository = "https://github.com/phant0mw0lf/pipetree"
Issues = "https://github.com/phant0mw0lf/pipetree/issues"
Changelog = "https://github.com/phant0mw0lf/pipetree/blob/main/CHANGELOG.md"

[project.scripts]
pipetree = "pipetree.cli:main"

[project.optional-dependencies]
spark = [
    "pyspark[sql]>=4.0,<4.1",
    "delta-spark>=4.0,<4.1",
]
azure = [
    "azure-identity>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "twine>=6.0",
    "pytest-xdist>=3.8.0",
    "filelock>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipetree"
source-exclude = ["NOTES-for-blog.md", "examples/", "docs/", ".github/", "tests/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: requires a JVM + PySpark session (skipped when unavailable)",
    "conformance: slow generated merge-conformance cases (PIPETREE_CONFORMANCE_SEEDS)",
]

[tool.coverage.run]
source = ["src/pipetree"]
