# Databricks Asset Bundle for the pipetree example pipeline.
#
# Setup and parameters: see README.md.
#
# Deploy: databricks bundle deploy -t dev
# Run:    databricks bundle run pipetree_example -t dev

bundle:
  name: pipetree-example

variables:
  catalog:
    description: Unity Catalog catalog to write the example tables into
    default: main
  key_vault_url:
    description: >
      Key Vault to read `{secret: name}` values from, for example
      https://my-vault.vault.azure.net. Empty for a pipeline without secrets
      (the example's one source is a local CSV).
    default: ""
  key_vault_credential:
    description: >
      Name of the Unity Catalog service credential (created from an Access
      Connector for Azure Databricks) that reads the vault. Empty with an
      empty key_vault_url.
    default: ""

artifacts:
  pipetree:
    type: whl
    build: uv build --wheel
    path: ../../

resources:
  jobs:
    pipetree_example:
      name: "pipetree example run"
      tasks:
        - task_key: run_pipeline
          new_cluster:
            # Pin to a runtime available in your workspace. Service
            # credentials need 16.2+ (or 15.4 LTS).
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2" # Azure SKU; swap for your cloud
            num_workers: 0 # single-node is enough for the example's data
            data_security_mode: SINGLE_USER
          spark_python_task:
            python_file: ./run_on_databricks.py
            # No config_path parameter: run_on_databricks.py resolves it
            # relative to its own synced location (`__file__`), which is
            # robust regardless of the task's working directory - a
            # relative path parameter here would not be.
            parameters:
              - "${var.catalog}"
              - "${var.key_vault_url}"
              - "${var.key_vault_credential}"
          libraries:
            - whl: ../../dist/*.whl

targets:
  dev:
    default: true
    # No `workspace.host` here on purpose - relies on your `databricks`
    # CLI's default auth profile (`databricks configure` or
    # DATABRICKS_HOST/DATABRICKS_TOKEN env vars). Add one explicitly if
    # you use named profiles instead.
