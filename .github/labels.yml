# Single source of truth for the repository labels.
# The "Sync labels" workflow applies this file on every push to main that
# changes it: labels listed here are created or updated, and labels that are
# not listed are deleted. Edit this file, not the labels in the GitHub UI.

- name: "bug"
  color: "1d76db"
  description: "Something does not work as documented"

- name: "enhancement"
  color: "1d76db"
  description: "New feature or improvement"

- name: "documentation"
  color: "1d76db"
  description: "Improvements or additions to documentation"

- name: "question"
  color: "1d76db"
  description: "Further information is requested"

- name: "good first issue"
  color: "1d76db"
  description: "Good for newcomers"

- name: "help wanted"
  color: "1d76db"
  description: "Extra attention is needed"

- name: "wontfix"
  color: "1d76db"
  description: "This will not be worked on"

- name: "duplicate"
  color: "1d76db"
  description: "This issue or pull request already exists"

- name: "area: merge"
  color: "8b949e"
  description: "Merge strategies (scd1, scd2, deletes)"

- name: "area: graph"
  color: "8b949e"
