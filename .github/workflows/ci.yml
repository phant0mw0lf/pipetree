name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # checkout only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the Spark test suite can be skipped: it is skipped on a pull
  # request that only touches files the tests do not read (docs, markdown,
  # images, notebooks, other workflows, ...). A push to main always runs it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          code=false
          while IFS= read -r file; do
            case "$file" in
              # Files the tests and the type/lint checks never read. Anything
              # not listed here counts as code. Note that tests/test_examples.py
              # loads examples/pipeline.yaml, examples/data and examples/notebooks
              # (and the same under examples/with_problems), so those are code.
              *.md|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.ipynb) ;;
              LICENSE|CODEOWNERS|.gitignore|cliff.toml|.pre-commit-config.yaml) ;;
              # The documentation pages and the generated reference are read by
              # tests/test_docs_examples.py and tests/test_docs_reference.py.
              docs/src/content/*|docs/scripts/*|docs/public/pipetree.schema.json) code=true ;;
              docs/*|examples/demo-run.txt|examples/databricks/*|examples/fabric/*) ;;
              .github/workflows/ci.yml) code=true ;;
              .github/*) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Each xdist worker is its own process with its own local Spark session
      # (see tests/conftest.py).
      - name: Test
        run: uv run pytest --cov --cov-report=xml -n 4 --durations=25 -v

      # Runs only when the tests ran (this job is skipped otherwise). Pull
      # requests from forks get no secret: the token is then empty and the action
      # uploads tokenless. An upload problem never fails the check.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # The required status check. It always runs and reports, whether the heavy
  # tests ran, were skipped because no code changed, or failed.
  test:
    name: test
    needs: [changes, lint, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES (code=$CODE) lint=$LINT tests=$TESTS"
          [ "$CHANGES" = "success" ] || { echo "changes job did not succeed" >&2; exit 1; }
          [ "$LINT" = "success" ] || { echo "lint did not succeed" >&2; exit 1; }
          if [ "$CODE" = "true" ]; then
            [ "$TESTS" = "success" ] || { echo "tests did not succeed" >&2; exit 1; }
          else
            [ "$TESTS" = "skipped" ] || { echo "tests should have been skipped" >&2; exit 1; }
            echo "no code changes: tests skipped"
          fi
