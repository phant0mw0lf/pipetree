name: Conformance

# The full merge-conformance run: many generated histories per strategy against
# the reference model. Pull requests only run the small default seed count (see
# ci.yml); this workflow runs the full set every night, on demand, and can be
# called from a release workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds per strategy (the attributed range is 0-299)"
        type: string
        default: "300"
  workflow_call:
    inputs:
      seeds:
        description: "Seeds per strategy (the attributed range is 0-299)"
        type: string
        default: "300"

permissions:
  contents: read # checkout only

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Conformance (all four strategies)
        env:
          SEEDS: ${{ inputs.seeds || '300' }}
          PIPETREE_REQUIRE_SPARK: "1"
        run: |
          case "$SEEDS" in
            ''|*[!0-9]*) echo "seeds must be a non-negative integer, got '$SEEDS'" >&2; exit 1 ;;
          esac
          PIPETREE_CONFORMANCE_SEEDS="$SEEDS" uv run pytest tests/merge_conformance -n 4 -rs --durations=25 -v
