name: docs-live

# Points the production docs site (pipetree.dev) at a release. Cloudflare builds
# production from the branch `docs-live`; `main` and pull requests build as
# previews, the unreleased "next" docs (see docs/README.md, "Versions").
#
# The workflow writes one commit to `docs-live`: the `docs/` directory of the
# given ref and nothing else, minus the archive folder of the ref's own minor
# line (the site shows that line at the root, so the version select must not
# list it twice). Leaving `.github/` out keeps the push within what
# GITHUB_TOKEN may do: GitHub refuses a token push that changes workflow files.
#
# The release workflow calls it after each final release. A maintainer can run
# it by hand, for example once to create the branch, or to publish a docs fix
# without a release (pass a branch or commit; that publishes unreleased docs).

on:
  workflow_call:
    inputs:
      ref:
        description: Tag, branch or commit whose docs/ the site shows
        type: string
        required: true
      only-if-newest:
        description: Do nothing unless ref is the newest final release tag
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit whose docs/ the site shows
        type: string
        required: true
      only-if-newest:
        description: Do nothing unless ref is the newest final release tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-live
  cancel-in-progress: false

jobs:
  docs-live:
    name: Move docs-live
    runs-on: ubuntu-latest
    permissions:
      contents: write # create a commit and move the docs-live branch
    steps:
      - name: Write docs/ of the ref to docs-live
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          ONLY_IF_NEWEST: ${{ inputs.only-if-newest }}
        run: |
          set -euo pipefail
          branch=docs-live

          if [ "$ONLY_IF_NEWEST" = "true" ]; then
            # Final versions only (no a/b/rc, PEP 440), highest version first. A patch
            # for an older line (v0.1.2 after v0.2.0) must not move the site back.
            newest="$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V -r | sed -n '1p')"
            if [ "$REF" != "$newest" ]; then
              echo "$REF is not the newest final release ($newest), docs-live stays where it is"
              exit 0
            fi
          fi

          source_sha="$(gh api "repos/$REPO/commits/$REF" --jq .sha)"
          docs_tree="$(gh api "repos/$REPO/git/trees/$source_sha" --jq '.tree[] | select(.path == "docs" and .type == "tree") | .sha')"
          if [ -z "$docs_tree" ]; then
            echo "$REF ($source_sha) has no docs/ directory" >&2
            exit 1
          fi
          # The minor line the ref documents at the root: the generated CLI reference names the
          # version (docs/astro.config.mjs reads it the same way).
          version="$(gh api "repos/$REPO/contents/docs/src/content/docs/reference/cli.mdx?ref=$source_sha" --jq .content \
            | base64 -d | sed -n 's/.*(pipetree \([0-9][^)]*\)).*/\1/p' | sed -n '1p')"
          line="$(printf '%s' "$version" | cut -d. -f1-2)"
          if [ -z "$line" ]; then
            echo "docs/src/content/docs/reference/cli.mdx of $REF does not name the version" >&2
            exit 1
          fi

          # Drop the archive of that line; keep public/<line>/ (its schema URL stays valid).
          existing="$(gh api "repos/$REPO/git/trees/$docs_tree?recursive=1" --jq '.tree[].path')"
          drop="$(for path in "src/content/docs/$line" "src/content/versions/$line.json" "src/assets/$line"; do
            if printf '%s\n' "$existing" | grep -Fqx "$path"; then printf '%s\n' "$path"; fi
          done)"
          if [ -n "$drop" ]; then
            echo "leaving out the archive of $line:"
            printf '%s\n' "$drop" | sed 's/^/  /'
            docs_tree="$(printf '%s\n' "$drop" | jq -R . | jq -s --arg base "$docs_tree" '{base_tree: $base, tree: map(
                if endswith(".json") then {path: ., mode: "100644", type: "blob", sha: null}
                else {path: ., mode: "040000", type: "tree", sha: null} end)}' \
              | gh api "repos/$REPO/git/trees" --input - --jq .sha)"
          fi

          root_tree="$(jq -n --arg sha "$docs_tree" '{tree: [{path: "docs", mode: "040000", type: "tree", sha: $sha}]}' \
            | gh api "repos/$REPO/git/trees" --input - --jq .sha)"

          parent=""
          if parent="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null)"; then
            if [ "$(gh api "repos/$REPO/git/commits/$parent" --jq .tree.sha)" = "$root_tree" ]; then
              echo "docs-live already shows docs/ of $REF"
              exit 0
            fi
          else
            parent=""
          fi

          message="docs: pipetree.dev shows $REF"$'\n\n'"docs/ of $source_sha"
          commit="$(jq -n --arg m "$message" --arg t "$root_tree" --arg p "$parent" \
              '{message: $m, tree: $t, parents: (if $p == "" then [] else [$p] end)}' \
            | gh api "repos/$REPO/git/commits" --input - --jq .sha)"

          if [ -n "$parent" ]; then
            # Fast-forward: the new commit has the current tip as its parent.
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$commit" -F force=false > /dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" > /dev/null
          fi
          echo "docs-live is now $commit (docs/ of $REF, $source_sha)" | tee -a "$GITHUB_STEP_SUMMARY"
