name: PR title

# Squash merges use the PR title as the commit message, so it must be a
# Conventional Commit. See CONTRIBUTING.md.

on:
  # Safe use: nothing from the PR is checked out or executed; the action only
  # reads the PR title through the API with read-only permissions.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read # read the PR title

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          requireScope: false
