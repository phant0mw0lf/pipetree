name: docs

# Build check for the documentation site (docs/). Cloudflare builds and
# deploys the site itself; this job only makes sure a change still builds and
# that every internal link is valid.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/pipetree/model.py"
      - "src/pipetree/cli.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/pipetree/model.py"
      - "src/pipetree/cli.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build (checks internal links)
        working-directory: docs
        run: npm run build

      # The release site (branch docs-live, see docs/README.md, "Versions") is built
      # without the archive of the newest line, which it shows at the root.
      - name: Build as the release site
        working-directory: docs
        run: |
          set -eu
          line="$(sed -n 's/.*(pipetree \([0-9][^)]*\)).*/\1/p' src/content/docs/reference/cli.mdx | sed -n '1p' | cut -d. -f1-2)"
          rm -rf "src/content/docs/$line" "src/content/versions/$line.json" "src/assets/$line"
          DOCS_CHANNEL=release npm run build
