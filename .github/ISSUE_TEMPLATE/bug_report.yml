name: Bug report
description: Something does not work as documented
labels: ["bug", "needs triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small pipeline config and the command you ran, or a failing test.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pipetree version
      description: Output of `pipetree --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, PySpark / Delta versions, and where it runs (local, Databricks, Fabric).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
